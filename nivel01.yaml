#cloud-config

package_update: true

packages:
  - nginx

write_files:
  - path: /var/www/html/index.html
    permissions: '0644'
    content: |
      <!DOCTYPE html>
      <html lang="pt-BR">
      <head>
          <meta charset="UTF-8">
          <title>Página Inicial</title>
      </head>
      <body>
          <h1>Bem-vindo ao servidor Nginx!</h1>
          <p>Servidor configurado com sucesso usando Cloud-Init.</p>
      </body>
      </html>

runcmd:
  - systemctl restart nginx